<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menus KitchenDaily</title>
<style>
:root{--g:#1B7F39;--g2:#14602b;--o:#FF7A00;--b:#FBF4E9;--ink:#1d2a22;--mut:#5f6b63;--line:#e6ded0;--red:#c62828;--redbg:#fde8e8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--b);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}
header{background:var(--g);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header .src{font-size:12px;opacity:.85;flex:1;min-width:160px}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:18px;padding:6px 12px;font-size:13px}
.hbtn:hover{background:rgba(255,255,255,.25)}
.wrap{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
.sticky{position:sticky;top:0;z-index:20;background:var(--b);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px}
.pill.on{background:var(--g);color:#fff}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--g);border-radius:22px;padding:3px;gap:3px}
.seg button{border:none;background:none;border-radius:18px;padding:8px 18px;font-weight:700;font-size:14px;color:var(--g)}
.seg button.on{background:var(--g);color:#fff}
.weeknav{display:flex;align-items:center;gap:6px;margin-top:8px}
.weeknav button{border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--g)}
.weeknav button:disabled{opacity:.35;cursor:default}
.wlabel{font-weight:700;font-size:15px;padding:0 6px}
.weeknav .today{width:auto;height:auto;border-radius:14px;border:1px solid var(--o);background:#fff;color:var(--o);font-size:12px;font-weight:700;padding:5px 10px;white-space:nowrap;margin-left:4px;text-decoration:none}
.tabs{display:flex;gap:4px;margin-top:10px;border-bottom:2px solid var(--line)}
.tab{background:none;border:none;padding:8px 12px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--g);border-color:var(--o)}
.tab.qc{margin-left:auto;font-weight:400;font-size:12px}
.alerts{background:#fff4e5;border:1px solid #ffd3a3;border-left:5px solid var(--o);border-radius:8px;padding:8px 12px;margin:12px 0;font-size:13px}
.alerts div{margin:2px 0}
.ok{background:#eaf6ee;border:1px solid #bfe3ca;border-left:5px solid var(--g);border-radius:8px;padding:8px 12px;margin:12px 0;font-size:13px;color:var(--g2)}
.summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.big{font-size:22px;font-weight:700;color:var(--g)}
.bal{flex:1;min-width:220px}
.balbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eee;margin-top:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.stat{font-size:12px;color:var(--mut)} .stat b{font-size:15px;color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:14px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;color:var(--ink)}
.chip .n{color:var(--mut);margin-left:3px}
.chip.on{background:var(--o);border-color:var(--o);color:#fff}.chip.on .n{color:#fff}
.chip.zero{opacity:.45}
.glabel{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:8px 0 2px}
.more{background:none;border:none;color:var(--g);font-weight:700;padding:4px 0}
.result{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0 6px;font-size:13px;color:var(--mut)}
.link{background:none;border:none;color:var(--g);text-decoration:underline;padding:0;font-size:13px}
.btn{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700}
.btn.primary{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.card h3{font-size:14px;margin:0;line-height:1.3}
.meta{font-size:12px;color:var(--mut)}
.sku{font-family:Consolas,Menlo,monospace;font-size:12px;font-weight:700;color:var(--g2);background:#eef3ef;border-radius:5px;padding:1px 6px;user-select:all}
.dup textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff}
.dupres td{text-align:left;vertical-align:top}
.st-ok{color:var(--g2);font-weight:700}.st-ko{color:var(--red);font-weight:700}.st-warn{color:#b45300;font-weight:700}
.sugg{margin:3px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:12px 0}
.step{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.step b.n{display:inline-block;background:var(--o);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:12px;margin-right:6px}
.nut{display:flex;gap:10px;font-size:12px}.nut b{color:var(--ink)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;border-radius:10px;padding:2px 8px;background:#eef3ef;color:var(--g2);font-weight:700}
.badge.perm{background:var(--g);color:#fff}
.badge.prog{background:#fff1e2;color:#b45300}
.badge.warn{background:var(--redbg);color:var(--red)}
.alg{display:flex;gap:4px;flex-wrap:wrap}
.alg span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut);background:#fafafa}
.alg span.na{border-color:#ffd3a3;color:#b45300;background:#fff7ee}
.empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--mut)}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:#f4efe5;font-size:12px;position:sticky;top:0}
td.l,th.l{text-align:left}
td.low{background:var(--redbg);color:var(--red);font-weight:700}
td.cur{outline:2px solid var(--o);outline-offset:-2px}
td.click{cursor:pointer}
.tablewrap{overflow:auto;max-height:70vh;border-radius:10px;border:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.col h4{margin:0 0 8px;font-size:13px;color:var(--g)}
.col li{margin:4px 0;font-size:13px}
select,input[type=number]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:#fff}
input[type=number]{width:70px}
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px 20px;position:relative}
.sheet h2{margin:0 0 6px;font-size:18px;color:var(--g)}
.x{position:absolute;right:12px;top:10px;border:none;background:none;font-size:22px;color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.sec{margin-top:14px}.sec h4{margin:0 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.set{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:13px}
.note{font-size:12px;color:var(--mut)}
.qcchips .chip{font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:90%}
.loading{padding:60px;text-align:center;color:var(--mut)}
@media (max-width:700px){.sticky{position:static}.cols{grid-template-columns:1fr}.tab{padding:8px 7px;font-size:13px}.kv{grid-template-columns:1fr}header h1{font-size:16px}}
@media print{header,.sticky .tabs,.weeknav button,.today,.toolbar,.chips,.glabel,.more,.search,.alerts,.ok,.tab{display:none!important}.sticky{position:static}.card{break-inside:avoid;box-shadow:none}body{background:#fff}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Menus KitchenDaily</h1>
  <div class="src" id="src"></div>
  <button class="hbtn" id="refresh">↻ Rafraîchir</button>
  <button class="hbtn" id="openSettings">⚙ Réglages</button>
</header>
<div class="wrap" id="app"><div class="loading">Chargement des menus…</div></div>

<div class="modal" id="dishModal"><div class="sheet" id="dishSheet"></div></div>
<div class="modal" id="setModal"><div class="sheet" id="setSheet"></div></div>

<script>
/* Moteur commun « Menus KitchenDaily » : utilisé tel quel par la page (navigateur) et par Apps Script (Core.gs). */
function MenuCore() {
  var PROGRAMS = [
    { id: 'nut', group: 'KY Minceur', short: 'Nutri+', label: 'Minceur Nutri+', plan: 'p_nut', gam: 'g_nut' },
    { id: 'act', group: 'KY Minceur', short: 'Activ+', label: 'Minceur Activ+', plan: 'p_act', gam: 'g_act' },
    { id: 'ess', group: 'KY Minceur', short: 'Essentiel', label: 'Minceur Essentiel', plan: 'p_ess', gam: 'g_ess' },
    { id: 'con', group: 'KY Minceur', short: 'Consolidation', label: 'Minceur Consolidation', plan: 'p_con', gam: 'g_con' },
    { id: 'ky', group: 'KY Quotidien', short: 'KY Quotidien', label: 'KY Quotidien', plan: 'p_ky', gam: 'g_ky' }
  ];

  var ALLERGENS = [
    { id: 'gluten', label: 'gluten', syn: ['gluten', 'ble', 'froment', 'orge', 'seigle', 'avoine', 'epeautre'] },
    { id: 'lait', label: 'lait', syn: ['lait', 'lactose', 'laitier', 'produit laitier', 'creme', 'fromage', 'beurre'] },
    { id: 'oeuf', label: 'œuf', syn: ['oeuf', 'oeufs', 'oeuv'] },
    { id: 'soja', label: 'soja', syn: ['soja', 'soya'] },
    { id: 'celeri', label: 'céleri', syn: ['celeri'] },
    { id: 'moutarde', label: 'moutarde', syn: ['moutarde'] },
    { id: 'sulfites', label: 'sulfites', syn: ['sulfite', 'anhydride sulfureux'] },
    { id: 'coque', label: 'fruits à coque', syn: ['fruit a coque', 'fruits a coque', 'fruit a coques', 'fruits a coques', 'coque', 'noix', 'amande', 'noisette', 'pignon', 'cajou', 'pistache'] },
    { id: 'sesame', label: 'sésame', syn: ['sesame'] },
    { id: 'poisson', label: 'poisson', syn: ['poisson'] },
    { id: 'crustaces', label: 'crustacés', syn: ['crustace'] },
    { id: 'mollusques', label: 'mollusques', syn: ['mollusque'] },
    { id: 'arachide', label: 'arachide', syn: ['arachide', 'cacahuete'] },
    { id: 'lupin', label: 'lupin', syn: ['lupin'] },
    { id: 'porc', label: 'porc', syn: ['porc'] }
  ];
  // Mots reconnus mais qui ne sont pas des allergènes (préférences)
  var KNOWN_OTHER = ['viande', 'volaille', 'boeuf', 'veau', 'agneau', 'canard', 'dinde', 'poulet'];

  var DEFAULT_SETTINGS = {
    criteria: { protplus: 30, leger: 350, keto: 15, lowcarb: 30, lowsalt: 2 },
    minimums: { total: 15, veggie: 3, protplus: 0, leger: 0, lowcarb: 0, keto: 0, lowsalt: 0,
                sans_gluten: 4, sans_lait: 4 },
    showQcBadges: false,
    horizon: 12
  };

  function nk(s) {
    return String(s == null ? '' : s).replace(/œ/gi, 'oe').replace(/æ/gi, 'ae')
      .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function singular(w) { return w.split(' ').map(function (x) { return x.length > 3 ? x.replace(/[sx]$/, '') : x; }).join(' '); }
  function num(v) {
    if (v === '' || v == null) return null;
    if (typeof v === 'number') return v;
    var n = parseFloat(String(v).replace(',', '.').replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? null : n;
  }
  function round(v, d) { if (v == null) return null; var p = Math.pow(10, d || 0); return Math.round(v * p) / p; }
  function isActif(v) { return nk(v) === 'actif'; }
  function isPresent(v) { return nk(v) === 'present'; }
  function isValide(v) { return /^valide$/.test(nk(v)); }

  var SYN = {};
  ALLERGENS.forEach(function (a) { a.syn.forEach(function (s) { SYN[singular(nk(s))] = a.id; }); });

  function parseAllergens(txt) {
    var raw = nk(txt);
    var res = { set: {}, unknown: [], empty: raw === '' };
    if (res.empty) return res;
    raw.replace(/[()]/g, ',').split(/[,;.\/+]|\bet\b/).forEach(function (t) {
      t = t.trim(); if (!t) return;
      var s = singular(t);
      if (SYN[s]) { res.set[SYN[s]] = true; return; }
      if (KNOWN_OTHER.indexOf(s) >= 0) { res.set['_' + s] = true; return; }
      res.unknown.push(t);
    });
    return res;
  }

  function parseDates(label) {
    var m = String(label).match(/(\d{1,2})\/(\d{1,2})\/(\d{4}).*?(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    return { start: new Date(+m[3], +m[2] - 1, +m[1]), end: new Date(+m[6], +m[5] - 1, +m[4]) };
  }
  function dd(d) { return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function menuNum(v) {
    var s = nk(v);
    if (/^menu\s*0/.test(s) || /permanent/.test(s)) return 0;
    var m = s.match(/^menu\s*(\d+)/);
    return m ? +m[1] : null; // Surplus et autres : pas dans les menus
  }

  // Libellés saisis différemment (« Pommes de terre » / « Pomme de terre », espaces…) : regroupés
  function canonFacet(values) {
    var groups = {};
    values.forEach(function (v) {
      var s = String(v || '').trim(); if (!s) return;
      var k = singular(nk(s));
      groups[k] = groups[k] || {};
      groups[k][s] = (groups[k][s] || 0) + 1;
    });
    var map = {}, variants = [];
    Object.keys(groups).forEach(function (k) {
      var forms = Object.keys(groups[k]).sort(function (a, b) { return groups[k][b] - groups[k][a]; });
      map[k] = forms[0];
      if (forms.length > 1) variants.push(forms);
    });
    return { label: function (v) { var s = String(v || '').trim(); return s ? map[singular(nk(s))] : ''; }, variants: variants };
  }

  function build(raw, userSettings) {
    var S = mergeSettings(userSettings);
    var issues = [];
    function issue(type, code, nom, detail, where) { issues.push({ type: type, code: code || '', nom: nom || '', detail: detail, where: where }); }

    // ---- Semaines
    var seen = {}, weeks = [], dupCal = 0;
    (raw.calendar || []).forEach(function (r) {
      var d = parseDates(r[2]); var m = menuNum(r[1]);
      if (!d || m == null) return;
      var key = 'S' + r[0] + '-' + d.start.getFullYear();
      if (seen[key]) { dupCal++; if (seen[key].menu !== m) issue('Calendrier', '', '', 'S' + r[0] + ' : deux menus différents (Menu ' + seen[key].menu + ' et Menu ' + m + ')', 'Plan de menu › Schéma Appro'); return; }
      var w = { key: key, num: +r[0], year: d.start.getFullYear(), menu: m, start: d.start, end: d.end,
                label: 'S' + r[0] + ' · ' + dd(d.start) + ' → ' + dd(d.end) + ' · Menu ' + m };
      seen[key] = w; weeks.push(w);
    });
    weeks.sort(function (a, b) { return a.start - b.start; });
    if (dupCal) issue('Calendrier', '', '', 'Le calendrier est saisi 2 fois (' + dupCal + ' lignes en double). Sans effet sur l’app, mais à nettoyer pour éviter des écarts.', 'Plan de menu › Schéma Appro');

    // ---- Gamme
    var gam = {}, gamCount = {};
    (raw.gamme || []).forEach(function (g) { gamCount[g.sku] = (gamCount[g.sku] || 0) + 1; if (!gam[g.sku]) gam[g.sku] = g; });
    Object.keys(gamCount).forEach(function (k) { if (gamCount[k] > 1) issue('Doublon', k, gam[k].nom, 'Code présent ' + gamCount[k] + ' fois dans la gamme', 'GAMME PRODUITS › KD_KY_DB'); });

    // ---- Plats
    var planRows = raw.plan || [];
    var fProt = canonFacet(planRows.map(function (p) { return p.prot; }));
    var fGarn = canonFacet(planRows.map(function (p) { return p.garn; }));
    var fClasse = canonFacet(planRows.map(function (p) { return p.classe; }));
    var fSpec = canonFacet((raw.gamme || []).map(function (g) { return g.spec; }));
    var fSous = canonFacet(planRows.map(function (p) { return p.souscat; }));

    var dishes = [], codeSeen = {}, nameSeen = {};
    planRows.forEach(function (p) {
      var m = menuNum(p.menu);
      if (m == null) return;
      var code = String(p.code || '').trim();
      if (!code) { issue('Code manquant', p.ancien, p.nom, 'Plat en ' + p.menu + ' sans « Nouveau code » : impossible à relier à la gamme, non affiché', 'Plan de menu › GAMME SAISON 1 AH'); return; }
      if (codeSeen[code]) { issue('Doublon', code, p.nom, 'Code présent plusieurs fois dans le plan (' + codeSeen[code] + ' et ' + p.menu + ')', 'Plan de menu › GAMME SAISON 1 AH'); return; }
      codeSeen[code] = p.menu;
      var g = gam[code] || null;
      var allergTxt = p.allerg || (g ? g.allerg : '');
      var al = parseAllergens(allergTxt);
      var d = {
        code: code, nom: p.nom || (g && g.nom) || code, menu: m, permanent: m === 0,
        classe: fClasse.label(p.classe), statut: p.statut, progres: String(p.progres || '').trim(),
        validated: isValide(p.progres), saison: p.saison,
        souscat: fSous.label(p.souscat), prot: fProt.label(p.prot), garn: fGarn.label(p.garn),
        spec: g ? fSpec.label(g.spec) : '', piment: !!String(p.piment || '').trim(),
        desc: g ? (g.desc_pop || g.desc_menu || '') : '', descMenu: g ? g.desc_menu : '',
        ingr: p.ingr || (g ? g.ingr : ''),
        poids: num(p.poids), kcal: num(p.kcal), mg: num(p.mg), ags: num(p.ags), glu: num(p.glu),
        suc: num(p.suc), fib: num(p.fib), pro: num(p.pro), sel: num(p.sel),
        allergTxt: allergTxt, allergens: al.set, allergKnown: !al.empty,
        programs: {}, planPrograms: {}, qc: []
      };
      if (d.kcal == null && g) d.kcal = num(g.kcal);
      if (d.pro == null && g) d.pro = num(g.pro);
      if (d.glu == null && g) d.glu = num(g.glu);
      if (d.sel == null && g) d.sel = num(g.sel);
      d.isVeggie = nk(d.souscat) === 'vegetarien';
      d.hasPorc = !!al.set.porc || nk(d.prot) === 'porc';
      var where = 'Plan de menu › GAMME SAISON 1 AH';

      PROGRAMS.forEach(function (pg) {
        var inPlan = isPresent(p[pg.plan]);
        var inGam = g ? isActif(g[pg.gam]) : inPlan;
        d.planPrograms[pg.id] = inPlan; d.programs[pg.id] = inGam;
        if (g && inPlan !== inGam) {
          var t = pg.label + ' : plan « ' + (p[pg.plan] || 'vide') + ' » / gamme « ' + (g[pg.gam] || 'vide') + ' » (l’app suit la gamme)';
          d.qc.push(t); issue('Présent vs INACTIF', code, d.nom, t, 'Plan › col. ' + PROGRAMS_COL[pg.id] + ' / GAMME › ' + GAMME_COL[pg.id]);
        }
      });

      if (!g) { d.qc.push('absent de la gamme'); issue('Absent de la gamme', code, d.nom, 'Code introuvable dans KD_KY_DB', 'GAMME PRODUITS › KD_KY_DB'); }
      if (al.empty) { d.qc.push('allergènes non renseignés'); issue('Allergènes vides', code, d.nom, 'Préférences alimentaires vides : le plat n’est compté dans aucun filtre « Sans … »', where + ' › Préférences alimentaires'); }
      if (al.unknown.length) issue('Allergène non reconnu', code, d.nom, 'Mot(s) non reconnu(s) : « ' + al.unknown.join(' », « ') + ' » (texte : ' + allergTxt + ')', where + ' › Préférences alimentaires');
      if (g && p.allerg && g.allerg && !sameAllerg(p.allerg, g.allerg)) issue('Allergènes différents', code, d.nom, 'Plan : « ' + p.allerg + ' » / Gamme : « ' + g.allerg + ' »', 'Les 2 fichiers › Préférences alimentaires');
      if (g && g.nom && nk(g.nom) !== nk(p.nom)) issue('Nom différent', code, d.nom, 'Plan : « ' + p.nom + ' » / Gamme : « ' + g.nom + ' »', 'Les 2 fichiers › Nom PRODUIT');
      if (g && num(g.kcal) != null && num(p.kcal) != null && Math.abs(num(g.kcal) - num(p.kcal)) > Math.max(5, 0.02 * num(p.kcal)))
        issue('Kcal différentes', code, d.nom, 'Plan : ' + round(num(p.kcal)) + ' kcal / Gamme : ' + round(num(g.kcal)) + ' kcal', 'Les 2 fichiers › ENERGIE KCAL / plat');
      if (!d.validated) { d.qc.push('avancement : ' + (d.progres || 'vide')); issue('Pas validé', code, d.nom, 'En ' + p.menu + ' avec Progrès = « ' + (d.progres || 'vide') + ' »', where + ' › Progrès'); }
      if (nk(p.statut) !== 'valide') issue('Statut', code, d.nom, 'Statut = « ' + (p.statut || 'vide') + ' »', where + ' › Statut');
      ['kcal', 'pro', 'glu', 'sel'].forEach(function (k) { if (d[k] == null) issue('Nutrition manquante', code, d.nom, 'Valeur « ' + k + ' / plat » vide : le plat n’entre pas dans les filtres nutritionnels', where); });
      if (nk(d.classe) === 'vegetarien' && !d.isVeggie) issue('Végétarien incohérent', code, d.nom, 'Classe Végétarien mais sous-catégorie « ' + d.souscat + ' »', where + ' › Sous catégorie');
      if (d.isVeggie && (al.set.poisson || al.set.crustaces || al.set._viande || al.set._volaille || al.set.porc)) issue('Végétarien incohérent', code, d.nom, 'Sous-catégorie Végétarien mais allergènes : ' + allergTxt, where + ' › Préférences alimentaires');
      if (!d.prot) issue('Champ vide', code, d.nom, 'Type de protéine vide', where + ' › TYPE DE PROTEINE');
      if (!d.garn) issue('Champ vide', code, d.nom, 'Garniture vide', where + ' › GARNITURE');
      if (g && !d.spec) issue('Champ vide', code, d.nom, 'Spécialité vide', 'GAMME PRODUITS › SPECIALITE');
      var nn = nk(d.nom);
      if (nameSeen[nn]) issue('Doublon de nom', code, d.nom, 'Même nom que ' + nameSeen[nn], where + ' › Nom PRODUIT'); else nameSeen[nn] = code;
      dishes.push(d);
    });
    // Plats permanents ou de menu présents dans aucun programme
    dishes.forEach(function (d) { if (!PROGRAMS.some(function (pg) { return d.programs[pg.id]; })) issue('Aucun programme', d.code, d.nom, 'Plat en menu mais INACTIF dans les 5 programmes', 'GAMME PRODUITS › KD_KY_DB'); });

    [['Type de protéine', fProt], ['Garniture', fGarn], ['Classe', fClasse], ['Spécialité', fSpec], ['Sous-catégorie', fSous]].forEach(function (x) {
      x[1].variants.forEach(function (v) { issue('Libellé saisi différemment', '', '', x[0] + ' : « ' + v.join(' » / « ') + ' » (regroupés dans l’app)', 'Colonne ' + x[0]); });
    });
    // Classes proches (ex. « Riche en protéines & fibres » vs « … & source de fibres »)
    var classes = uniq(dishes.map(function (d) { return d.classe; }));
    classes.forEach(function (a) { classes.forEach(function (b) { if (a < b && nk(b).indexOf(nk(a).split('&')[0].trim()) === 0 && nk(a).split('&')[0] === nk(b).split('&')[0]) issue('Libellé saisi différemment', '', '', 'Classe : « ' + a + ' » / « ' + b + ' » (2 valeurs pour sans doute la même classe)', 'Plan de menu › Classe'); }); });

    var model = {
      settings: S, programs: PROGRAMS, allergens: ALLERGENS, weeks: weeks, dishes: dishes, issues: issues,
      meta: raw.meta || {}, filters: buildFilters(S),
      facets: {
        prot: { label: 'Protéine', values: uniq(dishes.map(function (d) { return d.prot; })) },
        garn: { label: 'Garniture', values: uniq(dishes.map(function (d) { return d.garn; })) },
        spec: { label: 'Spécialité', values: uniq(dishes.map(function (d) { return d.spec; })) },
        classe: { label: 'Classe', values: uniq(dishes.map(function (d) { return d.classe; })) }
      }
    };
    model.currentWeekIndex = function (today) {
      today = today || new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      for (var i = 0; i < weeks.length; i++) if (weeks[i].start <= today && today <= weeks[i].end) return i;
      for (i = 0; i < weeks.length; i++) if (weeks[i].start > today) return i;
      return weeks.length - 1;
    };
    model.weekDishes = function (wi, progId) {
      var w = weeks[wi]; if (!w) return [];
      return dishes.filter(function (d) { return (d.menu === 0 || d.menu === w.menu) && d.programs[progId]; })
        .sort(function (a, b) { return (a.permanent - b.permanent) || a.nom.localeCompare(b.nom, 'fr'); });
    };
    model.filterById = function (id) { for (var i = 0; i < model.filters.length; i++) if (model.filters[i].id === id) return model.filters[i]; return null; };
    model.count = function (list, filterId) {
      if (filterId === 'total') return list.length;
      var f = model.filterById(filterId); return f ? list.filter(f.test).length : 0;
    };
    model.alerts = function (wi, progId) {
      var list = model.weekDishes(wi, progId), out = [];
      Object.keys(S.minimums).forEach(function (fid) {
        var min = +S.minimums[fid] || 0; if (!min) return;
        var n = model.count(list, fid);
        if (n < min) out.push({ week: weeks[wi], program: progLabel(progId), filterId: fid, label: filterLabel(model, fid), count: n, min: min });
      });
      return out;
    };
    model.alertsRange = function (fromIdx, n) {
      var out = [];
      for (var i = fromIdx; i < Math.min(weeks.length, fromIdx + n); i++)
        PROGRAMS.forEach(function (pg) { out = out.concat(model.alerts(i, pg.id)); });
      return out;
    };
    model.filterLabel = function (fid) { return filterLabel(model, fid); };
    return model;
  }

  var PROGRAMS_COL = { ess: 'Prgm KD ESSENTIEL', nut: 'Prgm KD NUTRI+', act: 'Prgm KD ACTIV +', con: 'Prgm KD CONSOLIDATION', ky: 'Prgm KY EQUILIBRE' };
  var GAMME_COL = { ess: 'GAMME KD ESSENTIEL', nut: 'GAMME KD NUTRI +', act: 'GAMME KD ACTIV +', con: 'GAMME KD CONSOLIDATION', ky: 'GAMME KY QUOTIDIEN' };

  function progLabel(id) { for (var i = 0; i < PROGRAMS.length; i++) if (PROGRAMS[i].id === id) return PROGRAMS[i].label; return id; }
  function filterLabel(model, fid) { if (fid === 'total') return 'plats au total'; var f = model.filterById(fid); return f ? f.label.toLowerCase() : fid; }
  function uniq(a) { var o = {}; a.forEach(function (x) { if (x) o[x] = 1; }); return Object.keys(o).sort(function (x, y) { return x.localeCompare(y, 'fr'); }); }
  function sameAllerg(a, b) {
    var x = parseAllergens(a).set, y = parseAllergens(b).set;
    function k(o) { return Object.keys(o).filter(function (z) { return z.charAt(0) !== '_'; }).sort().join(); }
    var kx = k(x), ky = k(y);
    return kx === ky;
  }

  function buildFilters(S) {
    var c = S.criteria;
    var f = [
      { id: 'veggie', group: 'regime', label: 'Végétarien', hint: 'Sans viande ni poisson', test: function (d) { return d.isVeggie; } },
      { id: 'protplus', group: 'regime', label: 'Protéine+', hint: '> ' + c.protplus + ' g de protéines / plat', test: function (d) { return d.pro != null && d.pro > c.protplus; } },
      { id: 'leger', group: 'regime', label: 'Repas léger', hint: '< ' + c.leger + ' kcal / plat', test: function (d) { return d.kcal != null && d.kcal < c.leger; } },
      { id: 'lowcarb', group: 'regime', label: 'Faible en glucides', hint: '< ' + c.lowcarb + ' g de glucides / plat', test: function (d) { return d.glu != null && d.glu < c.lowcarb; } },
      { id: 'keto', group: 'regime', label: 'Keto', hint: '< ' + c.keto + ' g de glucides / plat', test: function (d) { return d.glu != null && d.glu < c.keto; } },
      { id: 'lowsalt', group: 'regime', label: 'Low salt', hint: '< ' + c.lowsalt + ' g de sel / plat', test: function (d) { return d.sel != null && d.sel < c.lowsalt; } }
    ];
    ALLERGENS.forEach(function (a) {
      f.push({ id: 'sans_' + a.id, group: 'sans', label: 'Sans ' + a.label, hint: 'Allergènes renseignés et sans ' + a.label,
        test: a.id === 'porc'
          ? function (d) { return d.allergKnown && !d.hasPorc; }
          : function (d) { return d.allergKnown && !d.allergens[a.id]; } });
    });
    return f;
  }

  function mergeSettings(u) {
    var S = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    if (u && typeof u === 'object') {
      ['criteria', 'minimums'].forEach(function (k) { if (u[k]) Object.keys(u[k]).forEach(function (x) { var v = parseFloat(u[k][x]); if (!isNaN(v)) S[k][x] = v; }); });
      if (u.showQcBadges != null) S.showQcBadges = !!u.showQcBadges;
      if (u.horizon) S.horizon = Math.max(4, Math.min(26, +u.horizon || 12));
    }
    return S;
  }

  return { build: build, DEFAULT_SETTINGS: DEFAULT_SETTINGS, PROGRAMS: PROGRAMS, ALLERGENS: ALLERGENS, parseAllergens: parseAllergens, nk: nk };
}

</script>
<script>
window.__BOOT__ = { api: "https://script.google.com/macros/s/AKfycbwlQHfUHoM0VFtn4u-odyk9uPZsqN_4zAwKP1XtaE_JI-bYIlfCZKkhzoU2tTl_0yJ8kg/exec" };
</script>
<script>
(function () {
  var Core = MenuCore();
  var M, raw, settings;
  var st = { prog: 'nut', wi: 0, tab: 'menu', filters: {}, facets: {}, q: '', more: false, planMode: 'filtre', planFilter: 'total', cmp: 'ky', qcType: '', dupText: '', dupFilters: {}, dupRun: false };
  var COLORS = { 'Volaille': '#F4B860', 'Viande': '#B5472F', 'Poisson': '#3A7CA5', 'Végétarien': '#1B7F39' };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(v, d) { return v == null ? '–' : (Math.round(v * Math.pow(10, d || 0)) / Math.pow(10, d || 0)).toString().replace('.', ','); }

  // ---------- Environnement (version autonome / Apps Script)
  var BOOT = window.__BOOT__ || {};
  var gas = typeof google !== 'undefined' && google.script && google.script.run;
  var API = BOOT.api || '';
  function getKey() { try { return localStorage.getItem('menusKY.key') || ''; } catch (e) { return window.__key || ''; } }
  function setKey(k) { window.__key = k; try { localStorage.setItem('menusKY.key', k); } catch (e) {} }
  function askKey(msg) {
    $('app').innerHTML = '<div class="empty" style="max-width:420px;margin:40px auto"><h2 style="color:var(--g);margin-top:0">Code d\u2019accès</h2>' +
      '<p>' + esc(msg || 'Saisis le code d\u2019accès communiqué par Guillaume.') + '</p><form id="kf" class="row" style="justify-content:center">' +
      '<input id="k" class="search" style="max-width:220px" autocomplete="off" placeholder="Code"><button class="btn primary">Valider</button></form></div>';
    $('kf').onsubmit = function (e) { e.preventDefault(); setKey($('k').value.trim()); loadAll(false); };
  }
  function apiGet(force, cb) {
    fetch(API + '?action=data&key=' + encodeURIComponent(getKey()) + (force ? '&refresh=1' : '') + '&t=' + Date.now())
      .then(function (r) { return r.json(); }).then(cb)
      .catch(function (e) { $('app').innerHTML = '<div class="empty">Impossible de lire les données (' + esc(e.message) + '). Réessaie dans un instant.</div>'; });
  }
  function loadAll(force) {
    if (API) {
      if (!getKey()) return askKey();
      $('app').innerHTML = '<div class="loading">Lecture des fichiers R&D…</div>';
      apiGet(force, function (res) {
        if (!res.ok) return res.error === 'code' ? askKey('Code incorrect, réessaie.') : ($('app').innerHTML = '<div class="empty">Erreur : ' + esc(res.error) + '</div>');
        raw = res.data; settings = res.settings; init();
      });
      return;
    }
    if (gas) {
      $('app').innerHTML = '<div class="loading">Lecture des Google Sheets…</div>';
      google.script.run.withSuccessHandler(function (res) { res = typeof res === 'string' ? JSON.parse(res) : res; raw = res.data; settings = res.settings; init(); })
        .withFailureHandler(function (e) { $('app').innerHTML = '<div class="empty">Erreur de lecture des Sheets : ' + esc(e.message) + '</div>'; })
        .getData(!!force);
    } else {
      raw = BOOT.data;
      try { settings = JSON.parse(localStorage.getItem('menusKY.settings') || 'null'); } catch (e) { settings = null; }
      init();
    }
  }
  function saveSettings(s, cb) {
    if (API) {
      fetch(API, { method: 'POST', body: JSON.stringify({ action: 'settings', key: getKey(), settings: s }) })
        .then(function (r) { return r.json(); })
        .then(function (r) { if (!r.ok) toast('Réglages non enregistrés : ' + r.error); cb && cb(); })
        .catch(function () { toast('Réglages non enregistrés (connexion).'); cb && cb(); });
      return;
    }
    if (gas) google.script.run.withSuccessHandler(cb).saveSettings(JSON.stringify(s));
    else { try { localStorage.setItem('menusKY.settings', JSON.stringify(s)); } catch (e) {} cb && cb(); }
  }
  function init() {
    M = Core.build(raw, settings);
    if (!st._init) { st.wi = M.currentWeekIndex(); st._init = true; }
    st.wi = Math.max(0, Math.min(st.wi, M.weeks.length - 1));
    var meta = M.meta || {};
    $('src').textContent = (API || gas ? 'Données en direct des fichiers R&D' : 'Version autonome · ' + (meta.source || '')) + ' · lu le ' + (meta.generatedAt || '');
    render();
  }
  $('refresh').onclick = function () { if (API || gas) loadAll(true); else toast('Version autonome : données figées au ' + ((M && M.meta.generatedAt) || '') + '. La version Apps Script relit les Sheets à chaque ouverture.'); };
  var canFile = !!gas || !!API || window.self === window.top; // téléchargement et impression bloqués dans un cadre d'aperçu
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3500);
  }
  function copyRows(rows, what) {
    var txt = rows.map(function (r) { return r.map(function (v) { return String(v == null ? '' : v).replace(/[\t\n]+/g, ' '); }).join('\t'); }).join('\n');
    function fallback() {
      $('dishSheet').innerHTML = '<button class="x" data-close="dishModal">×</button><h2>Copier ' + esc(what) + '</h2><p class="note">Sélectionne tout (Ctrl+A) puis copie (Ctrl+C).</p><textarea style="width:100%;height:300px">' + esc(txt) + '</textarea>';
      $('dishModal').classList.add('on');
    }
    try { navigator.clipboard.writeText(txt).then(function () { toast(rows.length - 1 + ' ligne(s) copiée(s) : colle-les dans un Sheet ou un mail.'); }, fallback); } catch (e) { fallback(); }
  }
  $('openSettings').onclick = openSettings;

  // ---------- Calculs d'affichage
  function baseList() { return M.weekDishes(st.wi, st.prog); }
  function activeTests(exceptFacet) {
    var tests = [];
    Object.keys(st.filters).forEach(function (id) { if (st.filters[id]) tests.push(M.filterById(id).test); });
    Object.keys(st.facets).forEach(function (k) {
      if (k === exceptFacet) return;
      var vals = st.facets[k]; if (!vals || !vals.length) return;
      tests.push(function (d) { return vals.indexOf(d[k]) >= 0; });
    });
    if (st.q) { var q = Core.nk(st.q); tests.push(function (d) { return Core.nk(d.nom).indexOf(q) >= 0 || Core.nk(d.code).indexOf(q) >= 0; }); }
    return tests;
  }
  function apply(list, tests) { return list.filter(function (d) { return tests.every(function (t) { return t(d); }); }); }
  function nActive() { var n = 0; Object.keys(st.filters).forEach(function (k) { if (st.filters[k]) n++; }); Object.keys(st.facets).forEach(function (k) { n += (st.facets[k] || []).length; }); return n + (st.q ? 1 : 0); }

  // ---------- Rendu principal
  function render() {
    var w = M.weeks[st.wi];
    var cur = M.programs.filter(function (p) { return p.id === st.prog; })[0] || M.programs[0];
    var groups = []; M.programs.forEach(function (p) { if (groups.indexOf(p.group) < 0) groups.push(p.group); });
    var h = '<div class="sticky"><div class="seg">' + groups.map(function (g) {
      var first = M.programs.filter(function (p) { return p.group === g; })[0];
      return '<button class="' + (g === cur.group ? 'on' : '') + '" data-group="' + esc(g) + '" data-first="' + first.id + '">' + esc(g) + '</button>';
    }).join('') + '</div>';
    var subs = M.programs.filter(function (p) { return p.group === cur.group; });
    if (subs.length > 1) h += '<div class="row" style="margin-top:8px">' + subs.map(function (p) {
      return '<button class="pill' + (p.id === st.prog ? ' on' : '') + '" data-prog="' + p.id + '">' + esc(p.short) + '</button>';
    }).join('') + '</div>';
    h += '<div class="weeknav"><button id="prev" ' + (st.wi <= 0 ? 'disabled' : '') + ' aria-label="Semaine précédente">◀</button>' +
      '<span class="wlabel">' + esc(w ? w.label : 'Aucune semaine') + '</span>' +
      '<button id="next" ' + (st.wi >= M.weeks.length - 1 ? 'disabled' : '') + ' aria-label="Semaine suivante">▶</button>' +
      (st.wi !== M.currentWeekIndex() ? '<button class="today" id="today">↺ Semaine en cours</button>' : '') + '</div>';
    var nQc = M.issues.length;
    h += '<div class="tabs">' + [['menu', 'Menu de la semaine'], ['dup', 'Duplication de colis'], ['plan', 'Planning'], ['cmp', 'Comparer']].map(function (t) {
      return '<button class="tab' + (st.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '<button class="tab qc' + (st.tab === 'qc' ? ' on' : '') + '" data-tab="qc">Contrôle qualité (' + nQc + ')</button></div></div>';
    if (st.tab === 'menu') h += viewMenu();
    if (st.tab === 'plan') h += viewPlanning();
    if (st.tab === 'cmp') h += viewCompare();
    if (st.tab === 'dup') h += viewDup();
    if (st.tab === 'qc') h += viewQc();
    $('app').innerHTML = h;
    bind();
  }

  function alertBox() {
    var a = M.alerts(st.wi, st.prog), w = M.weeks[st.wi], p = progName(st.prog);
    if (!a.length) return '<div class="ok">✓ ' + esc('S' + w.num + ' – ' + p) + ' : tous les seuils sont atteints.</div>';
    return '<div class="alerts">' + a.map(function (x) {
      return '<div>⚠ <b>S' + x.week.num + ' – ' + esc(p) + '</b> : seulement ' + x.count + ' ' + esc(x.label) + ' (seuil ' + x.min + ')</div>';
    }).join('') + '</div>';
  }
  function progGroup(id) { for (var i = 0; i < M.programs.length; i++) if (M.programs[i].id === id) return M.programs[i].group; return ''; }
  function progName(id) { for (var i = 0; i < M.programs.length; i++) if (M.programs[i].id === id) return M.programs[i].label; return id; }

  function viewMenu() {
    var base = baseList(), tests = activeTests(), list = apply(base, tests);
    var h = alertBox();
    // Équilibre de la semaine
    var by = {}, kc = 0, pr = 0, nk = 0, np = 0;
    base.forEach(function (d) { by[d.souscat || 'Autre'] = (by[d.souscat || 'Autre'] || 0) + 1; if (d.kcal != null) { kc += d.kcal; nk++; } if (d.pro != null) { pr += d.pro; np++; } });
    var cats = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
    h += '<div class="summary"><div><div class="big">' + base.length + '</div><div class="stat">plats cette semaine</div></div>' +
      '<div class="bal"><div class="stat">Équilibre de la semaine</div><div class="balbar">' + cats.map(function (c) {
        return '<div title="' + esc(c) + ' : ' + by[c] + '" style="width:' + (100 * by[c] / base.length) + '%;background:' + (COLORS[c] || '#999') + '"></div>';
      }).join('') + '</div><div class="legend">' + cats.map(function (c) { return '<span><i style="background:' + (COLORS[c] || '#999') + '"></i>' + esc(c) + ' ' + by[c] + '</span>'; }).join('') + '</div></div>' +
      '<div class="stat">Moyenne<br><b>' + fmt(nk ? kc / nk : null) + '</b> kcal · <b>' + fmt(np ? pr / np : null) + '</b> g prot.</div></div>';
    // Recherche + filtres
    h += '<div class="row"><input class="search" id="q" placeholder="Rechercher un plat…" value="' + esc(st.q) + '"></div>';
    h += chipGroup('Régimes', M.filters.filter(function (f) { return f.group === 'regime'; }), base);
    var sans = M.filters.filter(function (f) { return f.group === 'sans'; });
    var main = ['sans_gluten', 'sans_lait', 'sans_oeuf', 'sans_porc', 'sans_poisson', 'sans_crustaces'];
    h += chipGroup('Allergènes', sans.filter(function (f) { return st.more || main.indexOf(f.id) >= 0 || st.filters[f.id]; }), base);
    h += '<button class="more" id="more">' + (st.more ? '▴ Moins de filtres' : '▾ Plus de filtres (autres allergènes, protéine, garniture, spécialité, classe)') + '</button>';
    if (st.more) Object.keys(M.facets).forEach(function (k) { h += facetGroup(k, base); });
    h += '<div class="result"><span><b>' + list.length + '</b> plat' + (list.length > 1 ? 's' : '') + (nActive() ? ' sur ' + base.length + ' · <button class="link" id="clear">Effacer les filtres</button>' : '') + '</span>' +
      '<span class="toolbar row"><button class="btn" id="copy">Copier la liste</button>' + (canFile ? '<button class="btn" id="csv">Export CSV</button><button class="btn" id="print">Imprimer / PDF</button>' : '') + '</span></div>';
    if (!list.length) h += '<div class="empty">Aucun plat ne correspond à ces filtres.</div>';
    else h += '<div class="grid">' + list.map(card).join('') + '</div>';
    return h;
  }

  // ---------- Duplication de colis
  function parseParcel(txt) {
    var byCode = {}, rows = [], seen = {};
    M.dishes.forEach(function (d) { byCode[d.code.toUpperCase()] = d; });
    String(txt || '').split(/\n+/).forEach(function (line) {
      var raw = line.trim(); if (!raw) return;
      var qm = raw.match(/^(\d{1,2})\s*[x×*]?\s+/i), qty = qm ? +qm[1] : 1;
      var codes = raw.match(/\b(KU|KD|KT|KX|KY|DB|DS)\s?-?\d{2,4}\b/gi);
      if (codes) {
        codes.forEach(function (c) {
          var k = c.replace(/[\s-]/g, '').toUpperCase(), d = byCode[k];
          if (seen[k]) { seen[k].qty += qty; return; }
          var r = { line: raw, code: k, dish: d || null, qty: qty }; seen[k] = r; rows.push(r);
        });
        return;
      }
      var n = Core.nk(raw.replace(/^(\d{1,2})\s*[x×*]?\s+/i, '')), best = null;
      if (n.length >= 6) M.dishes.forEach(function (d) {
        var dn = Core.nk(d.nom);
        if (!best && (dn === n || (n.length > 10 && dn.indexOf(n) >= 0) || (dn.length > 10 && n.indexOf(dn) >= 0))) best = d;
      });
      var key = best ? best.code : 'L' + rows.length;
      if (best && seen[key]) { seen[key].qty += qty; return; }
      var r = { line: raw, code: best ? best.code : '', dish: best, qty: qty }; seen[key] = r; rows.push(r);
    });
    return rows;
  }
  function dupTests() { return Object.keys(st.dupFilters).filter(function (k) { return st.dupFilters[k]; }).map(function (k) { return M.filterById(k); }); }

    for (var i = st.wi + 1; i < M.weeks.length; i++) if ((d.menu === 0 || d.menu === M.weeks[i].menu) && d.programs[st.prog]) return M.weeks[i];
    return null;
  }
  function suggest(d, avail, exclude, tests) {

        return { d: x, s: sc };
      }).sort(function (a, b) { return b.s - a.s; }).slice(0, 3).map(function (o) { return o.d; });
  }

  function weekRows() {
    var w = M.weeks[st.wi], list = apply(baseList(), activeTests());
    return [['Semaine', 'Programme', 'Code', 'Plat', 'Permanent', 'Classe', 'Protéine', 'Garniture', 'Spécialité', 'kcal', 'Protéines (g)', 'Glucides (g)', 'Sel (g)', 'Allergènes', 'Avancement']].concat(list.map(function (d) {
        return ['S' + w.num + ' ' + w.year, progName(st.prog), d.code, d.nom, d.permanent ? 'Oui' : '', d.classe, d.prot, d.garn, d.spec, fmt(d.kcal), fmt(d.pro, 1), fmt(d.glu, 1), fmt(d.sel, 2), d.allergKnown ? d.allergTxt : 'non renseignés', d.progres];
      }));
  }
  function exportWeek() { var w = M.weeks[st.wi]; download('Menu_' + progName(st.prog).replace(/\W+/g, '_') + '_S' + w.num + '_' + w.year + '.csv', weekRows()); }
  function qcRows() { return [['Type', 'Code', 'Plat', 'Détail', 'Où corriger']].concat(M.issues.filter(function (i) { return !st.qcType || i.type === st.qcType; }).map(function (i) { return [i.type, i.code, i.nom, i.detail, i.where]; })); }

  // ---------- Événements
  function bind() {
    var app = $('app');
    app.querySelectorAll('[data-group]').forEach(function (b) { b.onclick = function () {
      var g = b.getAttribute('data-group'), cur = M.programs.filter(function (p) { return p.id === st.prog; })[0];
      if (cur.group !== g) { st.prog = st.lastByGroup && st.lastByGroup[g] || b.getAttribute('data-first'); if (st.cmp === st.prog) st.cmp = st.prog === 'ky' ? 'nut' : 'ky'; render(); } }; });
    app.querySelectorAll('[data-prog]').forEach(function (b) { b.onclick = function () { st.prog = b.getAttribute('data-prog'); st.lastByGroup = st.lastByGroup || {}; st.lastByGroup[progGroup(st.prog)] = st.prog; if (st.cmp === st.prog) st.cmp = st.prog === 'ky' ? 'ess' : 'ky'; render(); }; });
    app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { st.tab = b.getAttribute('data-tab'); render(); }; });
    if ($('prev')) $('prev').onclick = function () { st.wi--; render(); };
    if ($('next')) $('next').onclick = function () { st.wi++; render(); };
    if ($('today')) $('today').onclick = function () { st.wi = M.currentWeekIndex(); render(); };
    app.querySelectorAll('[data-f]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-f'); st.filters[id] = !st.filters[id]; render(); }; });
    app.querySelectorAll('[data-facet]').forEach(function (b) { b.onclick = function () {
      var k = b.getAttribute('data-facet'), v = b.getAttribute('data-v'), a = st.facets[k] = st.facets[k] || [], i = a.indexOf(v);
      if (i >= 0) a.splice(i, 1); else a.push(v); render(); }; });
    if ($('more')) $('more').onclick = function () { st.more = !st.more; render(); };
    if ($('clear')) $('clear').onclick = function () { st.filters = {}; st.facets = {}; st.q = ''; render(); };
    if ($('q')) { var t; $('q').oninput = function (e) { clearTimeout(t); var v = e.target.value; t = setTimeout(function () { st.q = v; render(); var q = $('q'); q.focus(); q.setSelectionRange(v.length, v.length); }, 200); }; }
    if ($('csv')) $('csv').onclick = exportWeek;
    if ($('copy')) $('copy').onclick = function () { copyRows(weekRows(), 'la liste'); };
    if ($('qccopy')) $('qccopy').onclick = function () { copyRows(qcRows(), 'les incohérences'); };
    if ($('print')) $('print').onclick = function () { window.print(); };
    app.querySelectorAll('.card').forEach(function (c) { c.onclick = function () { openDish(c.getAttribute('data-code')); }; });
    app.querySelectorAll('[data-open]').forEach(function (c) { c.onclick = function () { openDish(c.getAttribute('data-open')); }; });
    app.querySelectorAll('[data-pm]').forEach(function (b) { b.onclick = function () { st.planMode = b.getAttribute('data-pm'); render(); }; });
    if ($('planFilter')) $('planFilter').onchange = function (e) { st.planFilter = e.target.value; render(); };
    app.querySelectorAll('[data-go]').forEach(function (c) { c.onclick = function () {
      var p = c.getAttribute('data-go').split('|'); st.wi = +p[0]; st.prog = p[1]; st.filters = {}; st.facets = {}; st.q = '';
      if (p[2] !== 'total') st.filters[p[2]] = true; st.tab = 'menu'; render(); window.scrollTo(0, 0); }; });
    app.querySelectorAll('[data-df]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-df'); st.dupText = $('dupText').value; st.dupFilters[k] = !st.dupFilters[k]; render(); }; });
    if ($('dupGo')) $('dupGo').onclick = function () { st.dupText = $('dupText').value; st.dupRun = true; render(); };
    if ($('dupClear')) $('dupClear').onclick = function () { st.dupText = ''; st.dupRun = false; render(); };
    if ($('dupText')) $('dupText').oninput = function (e) { st.dupText = e.target.value; };
    if ($('dupCopy')) $('dupCopy').onclick = function () {
      copyRows([['Qté', 'SKU', 'Plat', 'Remplace']].concat((st._dupFinal || []).map(function (x) { return [x[0], x[1].code, x[1].nom, x[2] ? x[2].code + ' ' + x[2].nom : '']; })), 'le colis proposé');
    };
    if ($('cmp')) $('cmp').onchange = function (e) { st.cmp = e.target.value; render(); };
    app.querySelectorAll('[data-qc]').forEach(function (b) { b.onclick = function () { st.qcType = b.getAttribute('data-qc'); render(); }; });
    if ($('qcb')) $('qcb').onchange = function (e) { var s = JSON.parse(JSON.stringify(M.settings)); s.showQcBadges = e.target.checked; settings = s; saveSettings(s, init); };
    if ($('qccsv')) $('qccsv').onclick = function () { download('Controle_qualite_menus.csv', qcRows()); };
  }
  document.querySelectorAll('.modal').forEach(function (m) { m.addEventListener('click', function (e) { if (e.target === m || e.target.getAttribute('data-close')) m.classList.remove('on'); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.querySelectorAll('.modal.on').forEach(function (m) { m.classList.remove('on'); }); });
  loadAll(false);
  if (st.cmp === st.prog) st.cmp = 'ky';
})();
</script>
</body>
</html>
